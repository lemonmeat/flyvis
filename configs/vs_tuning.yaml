# VS tuning: vertical motion and rotation about horizontal axes (roll, pitch, and
# every axis in between). Run: python scripts/run_vs_tuning.py [key=value ...]

sweep: vs_tuning
index: 0
seed: 0
out_root: ${oc.env:FLYLOOP_RUNS,runs}

model:
  name: flow/0000/000
  dt: 0.01

eyes:
  axis_azimuth_deg: 80.0
  n_sub: 3

lptc:
  sources: [connectome, simple]
  tau_lptc: 0.01
  tau_lpi: 0.01
  g_exc: 1.0
  g_inh: 1.0

world:
  kind: checkerboard   # checkerboard or texture (sphere for rotations)
  size_deg: 20.0       # checkerboard square size
  alpha: 2.0           # texture spectral slope
  contrast: 1.0
  seed: 3

vertical:
  period_deg: 30.0     # horizontal stripes
  speed_deg_s: 60.0    # drifted down and up

rotation:
  omega_deg_s: 90.0
  axis_azimuths_deg: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]

t_settle: 0.5
t_move: 1.5            # last half averaged

sweep_list: []

hydra:
  run:
    dir: ${out_root}/${sweep}/${index}_${seed}
  output_subdir: .hydra
  job:
    chdir: false
